# Le cluster HorRAGor3 (épilogue MLOps du brief) — 3 couches isolées :
#
#   navigateur ── https://horragor.localhost ──> traefik ──> frontend
#   frontend ── https://api.horragor.localhost (TLS vérifié) ──> traefik ──> api-ia
#   api-ia ── data_net (INTERNE, étanche) ──> api-donnees ── db_net (INTERNE) ──> db
#   api-ia ── host-gateway ──> Ollama (hôte) + Langfuse (hôte:3000) + web (Enquêteur)
#
# Ségrégation des secrets : les identifiants Postgres ne sont fournis QU'À db et
# api-donnees ; api-ia ne connaît que DATA_API_URL. Les ${VAR} viennent du .env.
#
# Prérequis : ./scripts/gen_certs.sh et ./scripts/dump_supabase.sh (une fois),
# Ollama et Langfuse sur l'hôte.

networks:
  # Le réseau privé étanche du brief : internal → aucun trafic entrant/sortant
  # hors du cluster. La couche Données (db + api-donnees) n'a AUCUNE autre patte.
  data_net:
    internal: true
  # Défense en profondeur : la base n'est joignable QUE par l'API Données
  # (api-ia ne peut même pas tenter une connexion à db:5432).
  db_net:
    internal: true
  # Traefik ↔ frontend ↔ api-ia (bridge normal : donne aussi l'egress web à api-ia).
  front_net:

volumes:
  db_data:

services:
  db:
    # La base de la couche Données, souveraine : restaurée depuis le dump de
    # Supabase au premier démarrage (docker/db-init/), puis persistée en volume.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-horragor}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - ./data/db_init:/dump:ro
    healthcheck:
      # Via TCP : pendant la restauration, le serveur temporaire n'écoute que
      # sur le socket Unix — « healthy » seulement une fois la base prête.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - db_net
    restart: unless-stopped

  traefik:
    # v3 récent obligatoire : Docker Engine ≥ 28 exige l'API 1.44, que les
    # vieux clients Traefik ne négocient pas (erreur « client version 1.24 »).
    image: traefik:v3
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # api-ia a deux pattes réseau (data_net + front_net) : on impose à
      # Traefik de le desservir par front_net, sinon il peut choisir l'IP
      # du réseau interne qu'il ne peut pas atteindre (504).
      - --providers.docker.network=horragor3_front_net
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
    ports:
      - "443:443" # l'UNIQUE port publié du cluster
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    networks:
      front_net:
        # Le frontend résout api.horragor.localhost → Traefik (routage interne).
        aliases:
          - api.horragor.localhost
    restart: unless-stopped

  api-donnees:
    build:
      context: .
      dockerfile: docker/api-donnees.Dockerfile
    environment:
      # Le mot de passe doit être URL-safe (hexadécimal recommandé, cf. .env.example).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-horragor}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - data_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api-ia:
    build:
      context: .
      dockerfile: docker/api-ia.Dockerfile
    environment:
      DATA_API_URL: http://api-donnees:8100 # jamais DATABASE_URL ici
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LANGFUSE_HOST: http://host.docker.internal:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/faiss_index:/app/data/faiss_index:ro # l'index, jamais dans l'image
    extra_hosts:
      - host.docker.internal:host-gateway # Ollama + Langfuse restent sur l'hôte
    networks:
      - data_net
      - front_net
    depends_on:
      - api-donnees
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.horragor.localhost`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_BASE_URL: https://api.horragor.localhost
      # httpx vérifie le TLS contre NOTRE autorité locale : chiffré ET authentifié.
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
    networks:
      - front_net
    depends_on:
      - api-ia
    labels:
      - traefik.enable=true
      - traefik.http.routers.front.rule=Host(`horragor.localhost`)
      - traefik.http.routers.front.entrypoints=websecure
      - traefik.http.routers.front.tls=true
      - traefik.http.services.front.loadbalancer.server.port=8501
    restart: unless-stopped
