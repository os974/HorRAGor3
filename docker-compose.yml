# Le cluster HorRAGor3 (épilogue MLOps du brief) — 3 couches isolées :
#
#   navigateur ── https://horragor.localhost (127.0.0.1:443) ──> traefik ──> frontend
#   frontend ── front_net (INTERNE) ── https://api.horragor.localhost ──> traefik ──> api-ia
#   api-ia ── data_net (INTERNE, étanche) ──> api-donnees ── db_net (INTERNE) ──> db
#   api-ia ── ia_net ──> web (Enquêteur) ; ── host-gateway ──> ollama-relay ──> Ollama (hôte)
#   api-ia ── langfuse_ingest ──> langfuse-web (traces de l'agent)
#
# Monitoring 360° (brief) : Prometheus + Grafana + Uptime Kuma pour la
# télémétrie des 3 composants, Langfuse pour l'agent (monitoring/langfuse/).
# Interfaces d'administration sur la boucle locale uniquement :
#   Langfuse 127.0.0.1:3000 · Uptime Kuma :3001 · Grafana :3002 · Prometheus :9090
#
# Le front n'a AUCUN chemin réseau vers api-ia hors de Traefik : le chiffrement
# UI → API IA est imposé par la topologie, pas par convention.
# Secrets : les identifiants Postgres admin restent dans db ; api-donnees n'a
# qu'un rôle en lecture seule ; api-ia ne connaît que DATA_API_URL.
#
# Prérequis : ./scripts/gen_certs.sh et ./scripts/dump_supabase.sh (une fois),
# Ollama sur l'hôte. Les ${VAR} viennent du .env.

include:
  - path: monitoring/langfuse/compose.yml
    project_directory: .
    env_file: .env

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

networks:
  # Traefik ↔ frontend (+ la sonde Uptime Kuma). Interne : le front n'a pas d'internet.
  front_net:
    internal: true
  # Traefik ↔ api-ia, avec sortie internet (Enquêteur web, Ollama sur l'hôte) ;
  # Prometheus et Uptime Kuma y lisent api-ia et Traefik.
  ia_net:
  # Le réseau privé étanche du brief : api-ia ↔ api-donnees, sans sortie
  # (Prometheus et Uptime Kuma y lisent l'API Données, jamais la base).
  data_net:
    internal: true
  # La base n'est joignable QUE par l'API Données.
  db_net:
    internal: true
  # Les outils d'observabilité entre eux (et la publication de leurs UIs).
  obs_net:

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  kuma_data:

services:
  traefik:
    <<: *hardening
    image: traefik:v3.7.15
    command:
      # Routage déclaré en fichier (traefik/dynamic.yml) : pas de socket Docker.
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.address=:8443
      - --entrypoints.internal.address=:8082
      - --ping=true
      - --ping.entrypoint=internal
      # Métriques par service (front, api) : la télémétrie de la couche
      # Présentation, lue par Prometheus sur le réseau privé.
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=internal
      - --log.level=INFO
    # Lire la clé du certificat (mode 600, propriétaire hôte) malgré cap_drop.
    cap_add:
      - DAC_READ_SEARCH
    ports:
      # Le SEUL port applicatif publié, et seulement sur la boucle locale (les
      # UIs d'observabilité le sont aussi, sur 127.0.0.1 : 3000-3002, 9090).
      - "127.0.0.1:443:8443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs/cluster.pem:/certs/cluster.pem:ro
      - ./certs/cluster.key:/certs/cluster.key:ro
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --ping.entrypoint=internal
        - --entrypoints.internal.address=:8082
      <<: *healthcheck
    networks:
      front_net:
        # Le frontend résout api.horragor.localhost → Traefik (seul chemin vers
        # l'IA) ; Uptime Kuma sonde aussi l'entrée publique par ces noms.
        aliases:
          - api.horragor.localhost
          - horragor.localhost
      ia_net:
    restart: unless-stopped

  db:
    # La base de la couche Données, souveraine : restaurée depuis le dump de
    # Supabase au premier démarrage (docker/db-init/), puis persistée en volume.
    <<: *hardening
    image: pgvector/pgvector:0.8.0-pg17
    # Le minimum pour que l'entrypoint initialise le volume puis bascule
    # sur l'utilisateur postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-horragor}
      POSTGRES_RO_USER: ${POSTGRES_RO_USER:-horragor_ro}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:?POSTGRES_RO_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - ./data/db_init:/dump:ro
    healthcheck:
      # Via TCP : pendant la restauration, le serveur temporaire n'écoute que
      # sur le socket Unix — « healthy » seulement une fois la base prête.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - db_net
    restart: unless-stopped

  api-donnees:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api-donnees.Dockerfile
    environment:
      # Rôle en LECTURE SEULE (SELECT, statement_timeout) ; mot de passe URL-safe.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_RO_USER:-horragor_ro}:${POSTGRES_RO_PASSWORD}@db:5432/${POSTGRES_DB:-horragor}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - data_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ollama-relay:
    # Ollama tourne sur l'hôte (GPU, poids des modèles) et n'écoute que sur
    # 127.0.0.1 : ce relais l'expose sur la SEULE passerelle Docker
    # (host-gateway, 172.17.0.1 par défaut), jamais sur le réseau local, sans
    # toucher à la configuration de l'hôte ni à localhost:11434.
    <<: *hardening
    image: alpine/socat:1.8.0.3
    network_mode: host
    user: "65534:65534"
    command:
      - TCP-LISTEN:11434,bind=${DOCKER_GATEWAY_IP:-172.17.0.1},fork,reuseaddr
      - TCP:127.0.0.1:11434
    healthcheck:
      # Chemin complet vérifié : écoute sur la passerelle → relais → Ollama.
      test: wget --quiet --tries=1 -O /dev/null http://${DOCKER_GATEWAY_IP:-172.17.0.1}:11434/api/version || exit 1
      <<: *healthcheck
    restart: unless-stopped

  api-ia:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api-ia.Dockerfile
    environment:
      DATA_API_URL: http://api-donnees:8100 # jamais d'identifiants de base ici
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LANGFUSE_HOST: http://langfuse-web:3000
      # Les clés du projet provisionné par l'init headless de Langfuse.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME manquant dans .env}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD manquant dans .env}
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/faiss_index:/app/data/faiss_index:ro # l'index, jamais dans l'image
    extra_hosts:
      - host.docker.internal:host-gateway # Ollama reste sur l'hôte (GPU, modèles)
    networks:
      - ia_net
      - data_net
      - langfuse_ingest
    depends_on:
      api-donnees:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # 8443 : le port d'écoute de Traefik dans le cluster (443 n'existe que côté hôte).
      API_BASE_URL: https://api.horragor.localhost:8443
      # httpx vérifie le TLS contre NOTRE autorité locale : chiffré ET authentifié.
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
    networks:
      - front_net
    depends_on:
      api-ia:
        condition: service_healthy
    restart: unless-stopped

  # ===================== Observabilité (télémétrie des 3 couches) =====================

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
    # ia_net : api-ia + Traefik ; data_net : api-donnees ; obs_net : Grafana.
    networks:
      - obs_net
      - ia_net
      - data_net
    restart: unless-stopped

  grafana:
    <<: *hardening
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Souveraineté : aucune donnée d'usage envoyée à l'éditeur.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      # Datasource + dashboards provisionnés as code (versionnés dans le repo).
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
    networks:
      - obs_net
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  uptime-kuma:
    <<: *hardening
    image: louislam/uptime-kuma:1.23.16
    # L'entrypoint réattribue /app/data (CHOWN) puis bascule sur PUID/PGID via
    # setpriv (SETUID/SETGID) : Node tourne ensuite sans privilège.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      PUID: "1001"
      PGID: "1001"
      # Fait confiance à la CA locale : les sondes TLS de l'entrée publique
      # vérifient le certificat, comme le front.
      NODE_EXTRA_CA_CERTS: /certs/ca.pem
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma_data:/app/data
      - ./certs/ca.pem:/certs/ca.pem:ro
    extra_hosts:
      - host.docker.internal:host-gateway # sonde du LLM via le relais Ollama
    # Une patte sur chaque réseau à sonder (sondes créées par
    # scripts/setup_uptime_kuma.py).
    networks:
      - obs_net
      - front_net
      - ia_net
      - data_net
      - langfuse_ingest
    restart: unless-stopped
