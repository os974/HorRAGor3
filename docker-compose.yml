# Le cluster HorRAGor3 (épilogue MLOps du brief) — 3 couches isolées :
#
#   navigateur ── https://horragor.localhost (127.0.0.1:443) ──> traefik ──> frontend
#   frontend ── front_net (INTERNE) ── https://api.horragor.localhost ──> traefik ──> api-ia
#   api-ia ── data_net (INTERNE, étanche) ──> api-donnees ── db_net (INTERNE) ──> db
#   api-ia ── ia_net ──> Ollama (hôte, host-gateway) + Langfuse (hôte:3000) + web (Enquêteur)
#
# Le front n'a AUCUN chemin réseau vers api-ia hors de Traefik : le chiffrement
# UI → API IA est imposé par la topologie, pas par convention.
# Secrets : les identifiants Postgres admin restent dans db ; api-donnees n'a
# qu'un rôle en lecture seule ; api-ia ne connaît que DATA_API_URL.
#
# Prérequis : ./scripts/gen_certs.sh et ./scripts/dump_supabase.sh (une fois),
# Ollama et Langfuse sur l'hôte. Les ${VAR} viennent du .env.

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  # Traefik ↔ frontend uniquement. Interne : le front n'a pas d'internet.
  front_net:
    internal: true
  # Traefik ↔ api-ia, avec sortie internet (Enquêteur web, Ollama sur l'hôte).
  ia_net:
  # Le réseau privé étanche du brief : api-ia ↔ api-donnees, sans sortie.
  data_net:
    internal: true
  # La base n'est joignable QUE par l'API Données.
  db_net:
    internal: true

volumes:
  db_data:

services:
  traefik:
    <<: *hardening
    image: traefik:v3.7.15
    command:
      # Routage déclaré en fichier (traefik/dynamic.yml) : pas de socket Docker.
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.address=:8443
      - --entrypoints.internal.address=:8082
      - --ping=true
      - --ping.entrypoint=internal
      - --log.level=INFO
    # Lire la clé du certificat (mode 600, propriétaire hôte) malgré cap_drop.
    cap_add:
      - DAC_READ_SEARCH
    ports:
      - "127.0.0.1:443:8443" # l'UNIQUE port publié, et seulement sur la boucle locale
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs/cluster.pem:/certs/cluster.pem:ro
      - ./certs/cluster.key:/certs/cluster.key:ro
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --ping.entrypoint=internal
        - --entrypoints.internal.address=:8082
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      front_net:
        # Le frontend résout api.horragor.localhost → Traefik (seul chemin vers l'IA).
        aliases:
          - api.horragor.localhost
      ia_net:
    restart: unless-stopped

  db:
    # La base de la couche Données, souveraine : restaurée depuis le dump de
    # Supabase au premier démarrage (docker/db-init/), puis persistée en volume.
    <<: *hardening
    image: pgvector/pgvector:0.8.0-pg17
    # Le minimum pour que l'entrypoint initialise le volume puis bascule
    # sur l'utilisateur postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-horragor}
      POSTGRES_RO_USER: ${POSTGRES_RO_USER:-horragor_ro}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:?POSTGRES_RO_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - ./data/db_init:/dump:ro
    healthcheck:
      # Via TCP : pendant la restauration, le serveur temporaire n'écoute que
      # sur le socket Unix — « healthy » seulement une fois la base prête.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - db_net
    restart: unless-stopped

  api-donnees:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api-donnees.Dockerfile
    environment:
      # Rôle en LECTURE SEULE (SELECT, statement_timeout) ; mot de passe URL-safe.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_RO_USER:-horragor_ro}:${POSTGRES_RO_PASSWORD}@db:5432/${POSTGRES_DB:-horragor}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - data_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api-ia:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api-ia.Dockerfile
    environment:
      DATA_API_URL: http://api-donnees:8100 # jamais d'identifiants de base ici
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LANGFUSE_HOST: http://host.docker.internal:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME manquant dans .env}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD manquant dans .env}
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/faiss_index:/app/data/faiss_index:ro # l'index, jamais dans l'image
    extra_hosts:
      - host.docker.internal:host-gateway # Ollama + Langfuse restent sur l'hôte
    networks:
      - ia_net
      - data_net
    depends_on:
      api-donnees:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # 8443 : le port d'écoute de Traefik dans le cluster (443 n'existe que côté hôte).
      API_BASE_URL: https://api.horragor.localhost:8443
      # httpx vérifie le TLS contre NOTRE autorité locale : chiffré ET authentifié.
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ./certs/ca.pem:/certs/ca.pem:ro
    networks:
      - front_net
    depends_on:
      api-ia:
        condition: service_healthy
    restart: unless-stopped
